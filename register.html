
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | AJ Robotics Lab</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>AJ Robotics Lab</h1>
    <p>Build. Learn. Experiment. Innovate.</p>
</header>

<main class="auth-container">
    <div class="auth-box">
        <h2>Create Your Account</h2>
        <p>Join the AJ Robotics Lab community.</p>

        <form id="registerForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Create a password" minlength="8" required>

            <button type="submit">Create Account</button>
        </form>

        <p id="message"></p>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <p><a href="index.html">Back to Home</a></p>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
